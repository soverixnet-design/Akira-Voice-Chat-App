name: Build signed Akira Play Store AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm upload-key secrets exist
        env:
          KEY_B64: ${{ secrets.AKIRA_UPLOAD_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.AKIRA_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AKIRA_UPLOAD_KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.AKIRA_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$KEY_PASS" &&
          test -n "$KEY_ALIAS" && test -n "$ALIAS_PASS" ||
          { echo "Configure all four AKIRA_UPLOAD_KEY* secrets first"; exit 1; }
      - name: Prepare protected upload key
        env:
          KEY_B64: ${{ secrets.AKIRA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/akira-upload.jks"
          chmod 600 "$RUNNER_TEMP/akira-upload.jks"
          printf 'AKIRA_UPLOAD_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/akira-upload.jks" >> "$GITHUB_ENV"
      - name: Build Akira web bundle
        run: npm ci && npm run build && npx cap sync android
      - name: Produce signed Android App Bundle
        env:
          AKIRA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.AKIRA_UPLOAD_KEYSTORE_PASSWORD }}
          AKIRA_UPLOAD_KEY_ALIAS: ${{ secrets.AKIRA_UPLOAD_KEY_ALIAS }}
          AKIRA_UPLOAD_KEY_PASSWORD: ${{ secrets.AKIRA_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew :app:bundleRelease --no-daemon)
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Akira-Play-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/akira-upload.jks"
