<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akira Admin Control Center</title>
<style>
:root{--bg:#07031a;--p1:#12082e;--p2:#1b0f40;--ln:rgba(255,255,255,.1);--tx:#f4efff;--mu:#a99fd0;--a:#9b4dff;--b:#ff3dc8;--c:#26d0ff;--g:#f6c453;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:radial-gradient(circle at 0 0,#2a1070 0,transparent 40%),var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.lg{display:grid;place-items:center;min-height:100%;padding:20px}.lgc{width:min(380px,100%);text-align:center;background:var(--p1);border:1px solid var(--g);border-radius:24px;padding:28px 22px;box-shadow:0 0 50px rgba(155,77,255,.35)}.lgc img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 40px rgba(255,61,200,.5)}.lgc h1{font-size:20px;margin:12px 0 4px}.lgc p{color:var(--mu);margin-bottom:14px}
input,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;box-shadow:0 3px 0 #4c1d95}.btn:active{transform:translateY(2px);box-shadow:none}.btn.s{padding:6px 11px;font-size:12.5px}.btn.o{background:none;border:1px solid var(--ln);box-shadow:none;color:var(--tx)}.btn.r{background:linear-gradient(90deg,#e11d48,#fb7185);box-shadow:0 3px 0 #7f1233}.btn.k{background:linear-gradient(90deg,#059669,#34d399);box-shadow:0 3px 0 #065f46;color:#04281c}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
nav{background:var(--p1);border-right:1px solid var(--ln);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.br{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}.br img{width:40px;height:40px;border-radius:50%}.br b{font-size:15px;line-height:1.1}.br small{color:var(--mu);display:block;font-size:11px}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--mu);text-decoration:none;margin-bottom:2px;cursor:pointer}nav a:hover{background:rgba(255,255,255,.06)}nav a.on{color:#fff;background:linear-gradient(90deg,rgba(155,77,255,.55),rgba(255,61,200,.25));box-shadow:inset 3px 0 0 var(--g)}nav a em{margin-left:auto;background:var(--b);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-style:normal}
main{padding:18px 22px 60px;min-width:0}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top h2{font-size:22px}.top .sp{flex:1}.burger{display:none}
.who{font-size:12.5px;color:var(--mu);text-align:right}.who b{color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.k{background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:14px}.k small{color:var(--mu)}.k b{display:block;font-size:24px;margin-top:2px}.k.w{border-color:var(--g)}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px}.card h3{font-size:15px;margin-bottom:10px}.card p.n{color:var(--mu);font-size:12.5px;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--ln);font-size:12.5px}td{padding:9px 10px;border-bottom:1px solid var(--ln)}tr:hover td{background:rgba(255,255,255,.03)}td input{margin:0;padding:6px 8px;width:90px}
.tag{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:700}.t-ok{background:rgba(52,211,153,.18);color:var(--ok)}.t-bad{background:rgba(251,113,133,.18);color:var(--bad)}.t-w{background:rgba(246,196,83,.18);color:var(--g)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row input,.row select{width:auto;flex:1;min-width:140px;margin:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars i{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(var(--c),var(--a));position:relative;min-height:6px}.bars i s{position:absolute;bottom:-18px;left:0;right:0;text-align:center;text-decoration:none;font-size:10.5px;color:var(--mu);font-style:normal}
.sw{width:44px;height:24px;border-radius:14px;background:#3a2d63;border:0;position:relative;padding:0;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.rtp{font-size:30px;font-weight:800}.mod{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:16px}.mdl{background:var(--p1);border:1px solid var(--g);border-radius:20px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}.mdl h3{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1245;border:1px solid var(--g);border-radius:20px;padding:10px 18px;z-index:99}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.ft small{color:var(--mu);display:block}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:fixed;z-index:40;left:-250px;width:230px;transition:.2s}nav.open{left:0}.burger{display:inline-block}main{padding:14px 12px 60px}}
.gh{color:var(--g);font-size:11.5px;margin:14px 10px 4px;font-weight:700}textarea{font:inherit}label{display:block;margin:6px 0 3px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
/* Connected preview additions */
body{min-height:100vh}.app{min-height:100vh}.lgc{max-width:425px}.lgc input{margin:8px 0}
#root{min-height:100vh}.br .brand-icon,.brand-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(140deg,#9b4dff,#ff3dc8);font-weight:900;color:white;box-shadow:0 5px 24px #ab55ff66}
.nav-section{padding:13px 12px 5px;color:#b8a6de;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
#nv a{user-select:none}.top h2{font-size:24px}.k b{overflow-wrap:anywhere}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.note{border:1px solid rgba(246,196,83,.4);background:rgba(246,196,83,.07);border-radius:12px;padding:12px 14px;margin:12px 0;color:#ffebad}
.card{margin:15px 0}.card h3{margin-bottom:10px}.card input,.card select{margin:8px 0}.controls{display:flex;gap:9px;flex-wrap:wrap}.controls>button{flex:1;min-width:120px}.subtle{color:#aaa1c5;font-size:13px}.rowline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 5px;border-bottom:1px solid rgba(255,255,255,.08)}.rowline small{display:block;color:#b4a5d4}.pill{padding:4px 10px;border-radius:10px;background:#452067;color:#efccff;font-size:12px}.err{color:#ffa4b6}.ok{color:#64efc3}.status{min-height:20px;white-space:pre-wrap}.bk{background:rgba(255,255,255,.07);border:1px solid #ffffff24;box-shadow:none}.wide{width:100%}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.fields label{font-size:12px;color:#bca9e6}.vline{height:1px;background:rgba(255,255,255,.13);margin:16px 0}.navonly{font-size:12px;color:#cdbbe3}.who{color:#dfd5ee;font-size:12px}
@media(max-width:760px){.app{display:block}nav#nv{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(280px,85vw);height:100dvh;transform:translateX(-105%);transition:transform .18s;box-shadow:15px 0 30px #05000c77}.app.menu-open nav#nv{transform:translateX(0)}main{padding:16px}.top{gap:8px;flex-wrap:wrap}.top h2{font-size:18px}.who{margin-left:auto}} 
</style></head><body><div id="root"><div class="lg">Loading…</div></div>
<script>
'use strict';
const API=''; // Same-origin API. This admin page must be served from the Akira server.
const pages=[
 ['Overview','dash','📊 Dashboard'],['Overview','analytics','📈 Analytics'],
 ['People','users','👥 Users'],['People','sellers','🪙 Coin Sellers'],['People','support','🎧 Support Inbox'],['People','moderation','🛡️ Moderation'],
 ['Money','recharge','💳 Wallet Recharge'],['Money','packages','💵 Packages & Exchange'],['Money','ledger','📒 Ledger'],['Money','store','🛍️ Store'],['Money','promos','🏷️ Promo Codes'],
 ['Rooms','rooms','🏠 Rooms'],['Rooms','events','🎉 Events'],['Rooms','themes','🎨 Themes & Backgrounds'],['Rooms','gifts','🎁 Gifts'],['Rooms','room-rewards','💰 Room Rewards'],['Rooms','rankings','🏆 Rankings'],['Rooms','levels','⭐ Levels & VIP'],['Rooms','tasks','📅 Tasks & Invites'],
 ['Games','lucky','🍀 Lucky Gifts'],['Games','games','🎮 Games'],
 ['App','banners','🖼️ Banners'],['App','notifications','🔔 Notifications'],['App','legal','📄 Legal & Help'],['App','settings','⚙️ Feature Switches'],
 ['Security','roles','🔐 Admin Roles'],['Security','audit','📜 Audit Log'],['Security','reports','🛡️ User Reports'],['Security','deletion','🗑️ Account Deletion'],['Security','system','🖥️ System']
];
const root=document.querySelector('#root');
let token='',role='',currentPage='dash';
const el=(tag,cls,content)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(content!==undefined)x.textContent=String(content);return x};
const $=s=>document.querySelector(s);
function setStatus(message,bad=false){const x=$('#status');if(x){x.textContent=message;x.className='status '+(bad?'err':'ok')}}
const checkId=s=>/^\d{6}$/.test(String(s).trim());
const checkAmount=s=>{const n=Number(s);return Number.isSafeInteger(n)&&n>0?n:null};
async function call(path,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{const response=await fetch(API+path,{...options,signal:controller.signal,headers:{...(token?{Authorization:'Bearer '+token}:{}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});
 let data;try{data=await response.json()}catch{data={}};
 if(!response.ok){if(response.status===401&&token){token='';role='';loginPage()}throw Error(data.error||('HTTP '+response.status))}return data;
 }catch(err){if(err.name==='AbortError')throw Error('Request timed out. Confirm balance before retrying.');throw err;}finally{clearTimeout(timer)}
}
const post=(path,body)=>call(path,{method:'POST',body:JSON.stringify(body)});
function requestId(){
 if(crypto.randomUUID)return crypto.randomUUID();
 const a=crypto.getRandomValues(new Uint8Array(16));
 a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
 const h=Array.from(a,x=>x.toString(16).padStart(2,'0'));
 return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10).join('');
}

function button(text,fn,cls='btn s'){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function input(parent,label,placeholder,typ='text'){
 const wrap=el('label');wrap.textContent=label;const x=el('input');x.type=typ;x.placeholder=placeholder||label;x.autocomplete='off';wrap.appendChild(x);parent.appendChild(wrap);return x;
}
function card(title){const c=el('section','card');c.appendChild(el('h3','',title));$('#pg').appendChild(c);return c}
function line(parent,label,value){const r=el('div','rowline');r.appendChild(el('div','',label));r.appendChild(el('strong','',String(value??'—')));parent.appendChild(r)}
function checkSuper(){if(role!=='super_admin'){setStatus('Super Admin permission required.',true);return false}return true}
function notice(text){const n=el('div','note',text);$('#pg').appendChild(n)}
function loginPage(){token='';role='';root.innerHTML='';const screen=el('div','lg'),panel=el('section','lgc');panel.appendChild(el('div','brand-icon','✦'));panel.appendChild(el('h1','','Akira Admin Control Panel'));panel.appendChild(el('p','','Secure connection to your Akira account'));
 const form=el('form');const email=input(form,'Email','Admin email','email');email.autocomplete='username';const password=input(form,'Password','Password','password');password.autocomplete='current-password';const msg=el('p','status err');const submit=el('button','btn wide','Sign In');submit.type='submit';form.append(submit,msg);panel.appendChild(form);screen.appendChild(panel);root.appendChild(screen);
 form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;msg.textContent='Signing in…';try{const result=await post('/api/v1/auth/login',{email:email.value.trim(),password:password.value});token=result.token||'';if(!token)throw Error('Missing login token');const dash=await call('/api/v1/admin/dashboard');role=dash.role;if(!role)throw Error('No admin role assigned');renderShell();render('dash',dash)}catch(err){token='';msg.textContent=err.message==='admin_forbidden'?'Account is not an administrator.':err.message}finally{submit.disabled=false}})
}
function renderShell(){root.innerHTML='';const shell=el('div','app');shell.id='shell';const nav=el('nav');nav.id='nv';const brand=el('div','br');const logo=el('div','brand-icon','✦');const label=el('div');label.append(el('b','','Akira'),el('small','','Admin Control Panel'));brand.append(logo,label);nav.appendChild(brand);let section='';for(const [group,key,title] of pages){if(group!==section){nav.appendChild(el('div','nav-section',group));section=group}const a=el('a','',title);a.href='#'+key;a.dataset.page=key;a.onclick=e=>{e.preventDefault();render(key);shell.classList.remove('menu-open')};nav.appendChild(a)}
 const main=el('main');const top=el('div','top');top.append(button('☰',()=>shell.classList.toggle('menu-open'),'btn o s'));const heading=el('h2');heading.id='heading';top.appendChild(heading);top.appendChild(el('div','sp'));top.appendChild(el('div','who','Role: '+role));top.append(button('Log out',async()=>{try{await call('/api/v1/auth/logout',{method:'POST'})}catch{}loginPage()},'btn o s'));main.append(top,el('div'));main.lastChild.id='pg';shell.append(nav,main);root.appendChild(shell)
}
async function render(page,initial){currentPage=page;document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('on',a.dataset.page===page));const entry=pages.find(p=>p[1]===page);$('#heading').textContent=entry?.[2]||'Admin';$('#pg').replaceChildren();try{switch(page){case 'dash':await dashPage(initial);break;case 'users':await usersPage();break;case 'sellers':await sellersPage();break;case 'recharge':await rechargePage();break;case 'roles':await rolesPage();break;case 'audit':await auditPage();break;case 'reports':await reportsPage();break;case 'deletion':await deletionPage();break;case 'rooms':await roomsPage();break;
 case 'analytics':await analyticsPage();break;
 case 'moderation':await reportsPage();break;
 case 'packages':await exchangePage();break;
 case 'ledger':await ledgerPage();break;
 case 'store':await catalogPage('');break;
 case 'themes':await catalogPage('theme');break;
 case 'gifts':await catalogPage('gift');break;
 case 'levels':await catalogPage('vip');break;
 case 'games':await gamesPage();break;
 case 'rankings':await rankingsPage();break;
 case 'events':await rewardsPage();break;
 case 'settings':await settingsPage();break;
 case 'system':await systemPage();break;
 default:plannedPage()}}catch(err){notice('Unable to load this section: '+err.message)}}
async function dashPage(initial){const data=initial||await call('/api/v1/admin/dashboard');const stats=data.stats||{};const c=card('Live Database Statistics');line(c,'Registered users',stats.users);line(c,'Rooms',stats.rooms);line(c,'Signed-in role',data.role);notice('Only verified API values are displayed. Online users, revenue and game metrics require additional backend endpoints.');const actions=card('Quick Actions');actions.append(button('Find user',()=>render('users')),button('Coin sellers',()=>render('sellers')),button('Wallet recharge',()=>render('recharge')))}
async function usersPage(){const c=card('Find account by 6-digit ID');const fields=el('div','fields');const uid=input(fields,'User ID','100001');const actions=el('div','controls');const result=el('div');actions.append(button('Search user',async()=>{result.replaceChildren();if(!checkId(uid.value)){result.textContent='Enter a valid 6-digit ID';return}try{const d=await call('/api/v1/admin/users/search?id='+encodeURIComponent(uid.value.trim()));if(!d.user){result.textContent='User not found';return}line(result,'ID',d.user.public_id);line(result,'Name',d.user.display_name);line(result,'Country',d.user.country_code||'-');try{const wallets=await call('/api/v1/control/users?q='+encodeURIComponent(uid.value.trim()));const found=(wallets.items||[]).find(x=>String(x.id)===uid.value.trim());if(found){line(result,'Coins — original wallet',found.coins);line(result,'Diamonds',found.diamonds);line(result,'Account status',found.is_banned?'Banned':'Active')}}catch(err){line(result,'Wallet lookup',err.message)}}catch(e){result.textContent=e.message}}));
 actions.append(button('Recent users',async()=>{result.replaceChildren();try{const d=await call('/api/v1/admin/users');for(const u of d.users||[])line(result,(u.display_name||'User')+' · '+u.public_id,u.country_code||'—')}catch(e){result.textContent=e.message}},'btn o s'));c.append(fields,actions,result);
 if(role==='super_admin'){const bc=card('User ban / unban');const id=input(bc,'User ID','100001');const controls=el('div','controls');for(const [word,banned] of [['Ban user',true],['Unban user',false]])controls.append(button(word,async()=>{if(!checkId(id.value)){setStatus('Invalid User ID',true);return}if(!confirm((banned?'Ban':'Unban')+' user '+id.value+'?'))return;try{await post('/api/v1/admin/users/ban',{publicId:id.value.trim(),banned});setStatus('User status updated.')}catch(e){setStatus(e.message,true)}},banned?'btn r s':'btn k s'));bc.append(controls);bc.appendChild(el('p','status'));bc.lastChild.id='status'} }

async function sellersPage(){
 const response=await call('/api/v1/control/sellers');
 const c=card('Coin Sellers — verified database');const list=response.items||[];
 line(c,'Registered sellers',list.length);
 for(const seller of list)line(c,(seller.name||'Seller')+' · '+seller.id,'Enabled: '+Boolean(seller.enabled)+' · Inventory: '+seller.balance);
 if(role!=='super_admin'){notice('Only Super Admin can manage sellers.');return}
 const editor=card('Seller permissions');
 const f=el('div','fields'), id=input(f,'Seller 6-digit ID','100001'), contact=input(f,'Seller contact','Official Akira Seller');
 editor.appendChild(f);
 const controls=el('div','controls'),msg=el('p','status');
 for(const [label,enabled] of [['Enable seller',true],['Disable seller',false]]){
  controls.appendChild(button(label,async()=>{
   if(!checkId(id.value)){msg.textContent='Valid 6-digit ID required';return}
   if(!confirm(label+' for '+id.value+'?'))return;
   try{await post('/api/v1/control/sellers',{id:id.value.trim(),contact:contact.value.trim()||'Official Akira Seller',enabled});msg.textContent='Seller status saved. Refresh this page to verify.';}
   catch(e){msg.textContent=e.message}
  },enabled?'btn k s':'btn r s'))
 }
 editor.append(controls,msg);
 const funding=card('Fund SELLER inventory — personal wallet stays separate');
 const fields=el('div','fields'),sid=input(fields,'Seller ID','100001'),amount=input(fields,'Coin amount','Positive integer','number');
 funding.appendChild(fields);let pending=null;
 const status=el('p','status'),fund=button('Add seller coins',async()=>{
  const uid=sid.value.trim(),n=checkAmount(amount.value);
  if(!checkId(uid)||!n){status.textContent='Enter a valid Seller ID and amount';return}
  if(!confirm('Add '+n+' coins to SELLER inventory of '+uid+'?'))return;
  const fingerprint=uid+':'+n;
  if(!pending||pending.fingerprint!==fingerprint)pending={fingerprint,id:requestId()};
  fund.disabled=true;status.textContent='Submitting...';
  try{const r=await post('/api/v1/control/seller-funds',{id:uid,delta:n,reason:'Admin seller funding',requestId:pending.id});status.textContent='Saved. Seller inventory balance: '+r.balance+(r.duplicate?' (duplicate request)':'');pending=null;}
  catch(e){status.textContent='Not confirmed; retry without changing values: '+e.message}
  finally{fund.disabled=false}
 });
 funding.append(fund,status)
}


async function rechargePage(){
 if(role!=='super_admin'){notice('Super Admin permission required.');return}
 notice('Recharge credits the ORIGINAL Akira coin wallet, shared with games and gifts. No demo balances.');
 const c=card('Credit coins to an existing 6-digit ID'),f=el('div','fields');
 const id=input(f,'User ID','100001'),amount=input(f,'Coin amount','Positive integer','number');
 c.appendChild(f);
 const msg=el('p','status');let pending=null;
 const submit=button('Confirm wallet recharge',async()=>{
  const uid=id.value.trim(),n=checkAmount(amount.value);
  if(!checkId(uid)||!n){msg.textContent='Invalid ID or amount';return}
  if(!confirm('CREDIT '+n+' coins to user '+uid+'?'))return;
  const fingerprint=uid+':'+n;
  if(!pending||pending.fingerprint!==fingerprint)pending={fingerprint,id:requestId()};
  submit.disabled=true;msg.textContent='Submitting...';
  try{const r=await post('/api/v1/control/wallet',{id:uid,delta:n,diamonds:0,reason:'Admin recharge',requestId:pending.id});msg.textContent='Success. Wallet balance: '+r.balance+(r.duplicate?' (already applied)':'');pending=null}
  catch(e){msg.textContent='Recharge not confirmed. Retry with same ID and amount: '+e.message}
  finally{submit.disabled=false}
 });
 c.append(submit,msg)
}

async function rolesPage(){if(role!=='super_admin'){notice('Super Admin permission required.');return}const c=card('Assigned admin roles');const data=await call('/api/v1/admin/roles');for(const x of data.roles||[])line(c,(x.display_name||'Admin')+' · '+x.public_id,x.role);const f=card('Change role');const fields=el('div','fields');const id=input(fields,'User ID','100001');const label=el('label','','Access level');const sel=el('select');for(const option of ['moderator','manager','admin','remove']){const o=el('option','',option);o.value=option;sel.appendChild(o)}label.appendChild(sel);fields.appendChild(label);f.appendChild(fields);f.append(button('Save role',async()=>{if(!checkId(id.value)){setStatus('Invalid User ID',true);return}if(!confirm('Set role '+sel.value+' for '+id.value+'?'))return;try{await post('/api/v1/admin/roles',{publicId:id.value.trim(),role:sel.value});await render('roles')}catch(e){setStatus(e.message,true)}}));const s=el('p','status');s.id='status';f.appendChild(s)}
