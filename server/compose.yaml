services:
  akira-api:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4301"
      PGHOST: akira-postgres
      PGPORT: "5432"
      PGUSER: akira
      PGDATABASE: akira_db
      PGPASSWORD_FILE: /run/secrets/db_password
      AKIRA_ALLOWED_ORIGINS: "${AKIRA_ALLOWED_ORIGINS:-https://api.soverixnet.online,https://voice.soverixnet.online,https://localhost,capacitor://localhost}"
      AKIRA_GOOGLE_WEB_CLIENT_ID: "${AKIRA_GOOGLE_WEB_CLIENT_ID:-}"
      AKIRA_LIVEKIT_API_KEY: "${AKIRA_LIVEKIT_API_KEY:-}"
      AKIRA_LIVEKIT_API_SECRET: "${AKIRA_LIVEKIT_API_SECRET:-}"
      AKIRA_LIVEKIT_URL: "${AKIRA_LIVEKIT_URL:-}"
      AKIRA_GAME_ENGINE_ENABLED: "${AKIRA_GAME_ENGINE_ENABLED:-false}"
    volumes:
      - /opt/akira/secrets/postgres_password:/run/secrets/db_password:ro
    ports:
      - "127.0.0.1:4301:4301"
    networks:
      - default
      - akira-private
    mem_limit: 192m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4301/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  akira-private:
    external: true
    name: akira-private
