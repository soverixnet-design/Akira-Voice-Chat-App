services:
  akira-api:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4301"
    ports:
      - "127.0.0.1:4301:4301"
    mem_limit: 192m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4301/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
